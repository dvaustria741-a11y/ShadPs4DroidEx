name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK + CMake
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "ndk;27.2.12479018" "cmake;3.22.1"

      # NOTE: known-incomplete, see PORTING_PLAN.md. vendor-winlator.sh's own path
      # assumptions don't match the checked-in tree yet, so this step is expected to
      # need follow-up fixes rather than succeed outright on the first few runs.
      - name: Vendor Winlator/Vortek components
        continue-on-error: true
        run: |
          chmod +x runtime/scripts/*.sh
          runtime/scripts/vendor-winlator.sh
          runtime/scripts/vendor-vortek.sh

      # external/shadps4 was vendored as a flat file copy, so its own .gitmodules
      # (fmt, glslang, ffmpeg, plus fork-specific winlator-app/libdeflate/box64)
      # were never checked out. Without this, CMake fails with "which is not an
      # existing directory" for externals/winlator-app and externals/libdeflate
      # (see run 87931460154). This is the manual equivalent of
      # `git submodule update --init --recursive` for that tree.
      - name: Populate shadPS4 externals
        run: |
          chmod +x runtime/scripts/init-shadps4-externals.sh
          runtime/scripts/init-shadps4-externals.sh

      - name: Grant execute permission for gradlew
        run: chmod +x external/shadps4/android/BachataS4/gradlew

      - name: Build debug APK (arm64-v8a)
        working-directory: external/shadps4/android/BachataS4
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: shadps4droidex-debug
          path: external/shadps4/android/BachataS4/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
