name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Builds the native runtime bundle (runtime.zip + host jniLibs) that ships
  # inside the APK when DOWNLOAD_RUNTIME=false (see build.gradle.kts). This is
  # a real multi-stage native build: shadPS4 core for x86_64 and a from-scratch
  # aarch64 cross-compile, box64 (host), the Vortek Vulkan client, staged into
  # a glibc rootfs, then zipped. See PORTING_PLAN.md and
  # runtime/scripts/build-runtime-debian.sh for the full chain. Must run
  # inside Debian Trixie (install-debian-runtime-deps.sh hard-requires
  # ID=debian) with the arm64 architecture enabled for cross dev packages.
  native-runtime:
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
    steps:
      # actions/checkout needs git on PATH inside the container; debian:trixie
      # doesn't ship it by default.
      - name: Install git
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends git ca-certificates

      - name: Checkout
        uses: actions/checkout@v4

      # actions/checkout inside a container job runs as a different UID than a
      # normal runner, which trips git's dubious-ownership protection (git
      # >=2.35.2) the moment shadPS4's own CMake shells out to `git` for
      # version info (externals/ffmpeg-core/CMakeLists.txt does this to pick
      # the matching FFMPEG prebuilt). Without this, that lookup silently
      # returns an empty SHA and CMake fails with "No FFMPEG prebuilt found
      # with corresponding commit SHA ()".
      - name: Mark workspace as safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install Debian Trixie cross-build dependencies
        run: |
          chmod +x runtime/scripts/install-debian-runtime-deps.sh
          runtime/scripts/install-debian-runtime-deps.sh

      - name: Build native runtime bundle
        run: |
          chmod +x runtime/scripts/*.sh
          runtime/scripts/build-runtime-debian.sh

      - name: Upload runtime.zip + staged assets
        uses: actions/upload-artifact@v4
        with:
          name: native-runtime-assets
          path: external/shadps4/android/BachataS4/app/src/main/assets/runtime/
          if-no-files-found: error

      - name: Upload host jniLibs
        uses: actions/upload-artifact@v4
        with:
          name: native-runtime-jnilibs
          path: external/shadps4/android/BachataS4/app/src/main/jniLibs/arm64-v8a/
          if-no-files-found: error

  build:
    needs: native-runtime
    # The native runtime build is expected to need a few iterations to go
    # green (see PORTING_PLAN.md open items — core/fex and core/guest_cpu
    # aren't wired into any CMake target yet). Don't block the APK build
    # (JNI libs baked in directly by Gradle, independent of runtime.zip)
    # while that's shaking out.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK + CMake
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Vendor Winlator/Vortek components
        run: |
          chmod +x runtime/scripts/*.sh
          runtime/scripts/vendor-winlator.sh
          runtime/scripts/vendor-vortek.sh

      # external/shadps4 was vendored as a flat file copy, so its own .gitmodules
      # (fmt, glslang, ffmpeg, plus fork-specific winlator-app/libdeflate/box64)
      # were never checked out. Without this, CMake fails with "which is not an
      # existing directory" for externals/winlator-app and externals/libdeflate
      # (see run 87931460154). This is the manual equivalent of
      # `git submodule update --init --recursive` for that tree.
      - name: Populate shadPS4 externals
        run: |
          chmod +x runtime/scripts/init-shadps4-externals.sh
          runtime/scripts/init-shadps4-externals.sh

      # Downloaded from the native-runtime job above (runs.zip + host jniLibs
      # produced by the Debian Trixie cross-build). Only present if that job
      # succeeded -- continue-on-error below so a still-broken native build
      # doesn't block validating the rest of the APK.
      - name: Download native runtime bundle
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: native-runtime-assets
          path: external/shadps4/android/BachataS4/app/src/main/assets/runtime/

      - name: Download native runtime jniLibs
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: native-runtime-jnilibs
          path: external/shadps4/android/BachataS4/app/src/main/jniLibs/arm64-v8a/

      - name: Grant execute permission for gradlew
        run: chmod +x external/shadps4/android/BachataS4/gradlew

      - name: Build debug APK (arm64-v8a)
        working-directory: external/shadps4/android/BachataS4
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: shadps4droidex-debug
          # The app has flavorDimensions("distribution") with playstore/fdroid
          # flavors, so assembleDebug outputs land under a per-flavor subdir
          # (outputs/apk/fdroid/debug/, outputs/apk/playstore/debug/), not
          # flat under outputs/apk/debug/ — hence the recursive glob.
          path: external/shadps4/android/BachataS4/app/build/outputs/apk/**/*.apk
          if-no-files-found: warn

